<section class="board" id="scr-recording-paused-transcript-scrolled">

    #scr-recording-paused-transcript-scrolled .tab{display:flex; flex-direction:column; gap:8px; padding:0 2px; cursor:pointer;}
    #scr-recording-paused-transcript-scrolled .tab span{font-size:15px; line-height:1.5; white-space:nowrap;}
    #scr-recording-paused-transcript-scrolled .tab.active span{font-weight:600; color:var(--text);}
    #scr-recording-paused-transcript-scrolled .tab:not(.active) span{font-weight:300; color:var(--text-weak);}
    #scr-recording-paused-transcript-scrolled .tab .bar{height:2px; border-radius:2px 2px 0 0; width:100%;}
    #scr-recording-paused-transcript-scrolled .tab.active .bar{background:var(--text);}
    #scr-recording-paused-transcript-scrolled .tab:not(.active) .bar{background:transparent;}
    #scr-recording-paused-transcript-scrolled .content{flex:1; min-height:0; overflow-y:auto; padding:0 16px; position:relative;}
    #scr-recording-paused-transcript-scrolled .bubble{background:#f1f7ed; border-radius:12px 4px 12px 12px; padding:12px; margin-left:40px; margin-bottom:12px; font-size:17px; font-weight:300; color:var(--text); line-height:1.5;}
    #scr-recording-paused-transcript-scrolled .scroll-to-bottom{position:absolute; right:16px; bottom:16px; width:52px; height:52px; border-radius:35px; background:#8f959e; border:0.5px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer;}
    #scr-recording-paused-transcript-scrolled .scroll-to-bottom img{width:32px; height:32px; display:block; transform:scaleY(-1);}
    #scr-recording-paused-transcript-scrolled .bottombar{flex-shrink:0; height:104px; box-sizing:border-box; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 24px 24px;}
    #scr-recording-paused-transcript-scrolled .timer{display:flex; align-items:center; gap:16px;}
    #scr-recording-paused-transcript-scrolled .timer img{width:44px; height:16px; display:block;}
    #scr-recording-paused-transcript-scrolled .timer span{font-size:14px; font-weight:600; color:var(--text);}
    #scr-recording-paused-transcript-scrolled .actions{display:flex; align-items:center; gap:16px;}
    #scr-recording-paused-transcript-scrolled .resume-btn{width:88px; height:44px; border-radius:16px; background:var(--primary); display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer;}
    #scr-recording-paused-transcript-scrolled .resume-btn img{width:20px; height:20px; display:block;}
    #scr-recording-paused-transcript-scrolled .resume-btn span{font-size:14px; font-weight:600; color:#fff; white-space:nowrap;}
    #scr-recording-paused-transcript-scrolled .stop-btn{height:44px; padding:6px 16px; border-radius:16px; background:rgba(31,35,41,.05); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; white-space:nowrap;}
