<section class="board" id="scr-upload-pending-select-mode">
  <style>
    #scr-upload-pending-select-mode { background: #f8f9fa; }
    #scr-upload-pending-select-mode .pw-content { position: absolute; left: 16px; top: 53.5px; width: 398px; }
    #scr-upload-pending-select-mode .pw-header { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
    #scr-upload-pending-select-mode .pw-header .back-btn { width: 32px; height: 32px; cursor: pointer; display: block; }
    #scr-upload-pending-select-mode .pw-header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; }
    #scr-upload-pending-select-mode .pw-header-action { font-size: 18px; font-weight: 300; color: var(--text); cursor: pointer; }

    #scr-upload-pending-select-mode .select-subbar { display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 300; margin-bottom: 20px; }
    #scr-upload-pending-select-mode .select-count { color: var(--text-faint); }
    #scr-upload-pending-select-mode .select-all { color: var(--text); cursor: pointer; }

    #scr-upload-pending-select-mode .rec-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 113px; }
    #scr-upload-pending-select-mode .rec-card { background: #fff; border-radius: 12px; padding: 20px 16px; }
    #scr-upload-pending-select-mode .rec-title {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; margin: 0 0 16px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #scr-upload-pending-select-mode .rec-meta { display: flex; align-items: center; gap: 8px; height: 20px; }
    #scr-upload-pending-select-mode .rec-meta-left { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-faint); font-weight: 300; min-width: 0; flex: 1; }
    #scr-upload-pending-select-mode .rec-meta-left .grp,
    #scr-upload-pending-select-mode .rec-meta-left .dur { display: flex; align-items: center; gap: 2px; }
    #scr-upload-pending-select-mode .rec-meta-left .dur { gap: 4px; }
    #scr-upload-pending-select-mode .rec-meta-left .grp { min-width: 0; flex: 0 1 auto; }
    #scr-upload-pending-select-mode .rec-meta-left .grp-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #scr-upload-pending-select-mode .rec-meta-left .sep,
    #scr-upload-pending-select-mode .rec-meta-left .dur,
    #scr-upload-pending-select-mode .rec-meta-left > span:not(.grp) { flex-shrink: 0; }
    #scr-upload-pending-select-mode .rec-meta-left .sep { width: 1px; height: 12px; background: var(--border); }
    #scr-upload-pending-select-mode .rec-meta-left img { display: block; flex-shrink: 0; }
    #scr-upload-pending-select-mode .rec-checkbox { width: 24px; height: 24px; cursor: pointer; display: block; flex-shrink: 0; }

    #scr-upload-pending-select-mode .bottom-bar {
      position: absolute; left: 0; bottom: 0; width: 430px; height: 93px; background: #eff0f1;
      display: flex; align-items: flex-start; justify-content: center; gap: 110px; padding-top: 14.5px; z-index: 40;
    }
    #scr-upload-pending-select-mode .bottom-bar .bb-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 28px; }
    #scr-upload-pending-select-mode .bottom-bar img { width: 24px; height: 24px; display: block; }
    #scr-upload-pending-select-mode .bottom-bar span { font-size: 12px; font-weight: 300; color: var(--text-weak); white-space: nowrap; }
  </style>
