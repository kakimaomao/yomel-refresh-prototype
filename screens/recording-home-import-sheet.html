<section class="board" id="scr-recording-home-import-sheet">
  <style>
    #scr-recording-home-import-sheet{ background:transparent; }

    /* scrim + sheet */
    #scr-recording-home-import-sheet .scrim{position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:10; display:flex; align-items:flex-end; cursor:pointer;}
    #scr-recording-home-import-sheet .sheet{width:100%; background:#f2f3f5; border-radius:8px 8px 0 0; cursor:default;}
    #scr-recording-home-import-sheet .sheet-header{position:relative; display:flex; align-items:center; justify-content:center; padding:20px; border-bottom:1px solid var(--border);}
    #scr-recording-home-import-sheet .sheet-close{position:absolute; left:20px; top:50%; transform:translateY(-50%); width:20px; height:20px; cursor:pointer;}
    #scr-recording-home-import-sheet .sheet-close img{width:20px; height:20px; display:block;}
    #scr-recording-home-import-sheet .sheet-title{font-size:18px; font-weight:600; color:var(--text);}
    #scr-recording-home-import-sheet .sheet-body{display:flex; flex-direction:column; gap:20px; padding:20px 16px 48px;}
    #scr-recording-home-import-sheet .sheet-btn{background:#fff; border-radius:12px; height:64px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; text-align:center; line-height:1.5;}
    #scr-recording-home-import-sheet .sheet-btn.primary{color:var(--primary); font-weight:600;}
    #scr-recording-home-import-sheet .sheet-btn.secondary{color:var(--text); font-weight:300;}
    #scr-recording-home-import-sheet .sheet-or{display:flex; align-items:center; gap:12px;}
    #scr-recording-home-import-sheet .sheet-or .line{flex:1; height:1px; background:var(--border);}
    #scr-recording-home-import-sheet .sheet-or span{font-size:13px; font-weight:300; color:var(--text-faint); white-space:nowrap;}
  </style>

  <!-- the real recording-home screen underneath shows through — this
       fragment is just the scrim + sheet overlay -->

  <!-- "音声をインポート" bottom sheet, opened from the side menu's インポート row -->
  <div class="scrim" data-tap="close:import-sheet">
    <div class="sheet" data-tap="noop">
      <div class="sheet-header">
        <div class="sheet-close" data-tap="close:import-sheet"><img src="../assets/icon-close.svg" alt="閉じる"></div>
        <div class="sheet-title">音声をインポート</div>
      </div>
      <div class="sheet-body">
        <div class="sheet-btn primary" data-tap="go:import-file-picker"><span>ファイルからインポート</span></div>
        <div class="sheet-or"><div class="line"></div><span>or</span><div class="line"></div></div>
        <div class="sheet-btn secondary" data-tap="open:import-other-apps-help">他のアプリから取り込む方法</div>
      </div>
    </div>
  </div>
</section>
