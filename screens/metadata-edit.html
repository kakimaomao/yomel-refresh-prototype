<section class="board" id="scr-metadata-edit">
  <style>
    #scr-metadata-edit{ background:#f8f9fa; }
    #scr-metadata-edit .content{
      position:absolute; top:69px; left:16px; width:398px;
      display:flex; flex-direction:column; gap:16px;
    }
    #scr-metadata-edit .title-row{
      position:relative; display:flex; align-items:center; justify-content:center; padding:20px 0;
    }
    #scr-metadata-edit .title{
      text-align:center; font-size:20px; font-weight:600; color:var(--text);
    }
    #scr-metadata-edit .sections{ display:flex; flex-direction:column; gap:48px; }
    #scr-metadata-edit .section-group{ display:flex; flex-direction:column; gap:20px; }
    #scr-metadata-edit .section{ display:flex; flex-direction:column; gap:12px; }
    #scr-metadata-edit .section-label{ font-size:18px; font-weight:600; color:var(--text-faint); padding:0 20px; }
    #scr-metadata-edit .card{ background:#fff; border-radius:12px; padding:2px 20px; display:flex; flex-direction:column; }
    #scr-metadata-edit .card-row{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      min-height:56px; padding:12px 0; border-bottom:1px solid rgba(31,35,41,.15);
    }
    #scr-metadata-edit .card-row:last-child{ border-bottom:none; }
    #scr-metadata-edit .card-row.memo{ align-items:flex-start; min-height:112px; padding:18.5px 0; }
    #scr-metadata-edit .placeholder{ font-size:18px; font-weight:300; color:var(--placeholder); }
    #scr-metadata-edit .placeholder.editable-title{ color:var(--text); min-width:1px; width:100%; white-space:normal; word-break:break-word; }
    #scr-metadata-edit .row-left{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
    #scr-metadata-edit .row-left img{ width:20px; height:20px; display:block; }
    #scr-metadata-edit .row-left span{ font-size:18px; font-weight:300; color:var(--text); white-space:nowrap; }
    #scr-metadata-edit .row-right{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; justify-content:flex-end; }
    #scr-metadata-edit .row-right .value{ font-size:17px; font-weight:300; color:var(--text-weak); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
    #scr-metadata-edit .row-right img{ width:20px; height:20px; display:block; flex-shrink:0; }
    #scr-metadata-edit .tag-chip{ background:rgba(31,35,41,.05); font-size:13px; font-weight:300; color:var(--text); padding:4px 6px; }
    #scr-metadata-edit .btn-group{ display:flex; flex-direction:column; gap:8px; }
    #scr-metadata-edit .save-btn{ width:100%; height:52px; }
    #scr-metadata-edit .cancel-btn{
      width:100%; height:52px; display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:600; color:var(--text-faint); cursor:pointer;
    }
  </style>

  <!-- status bar -->
  <div class="statusbar">
    <span class="time">9:41</span>
    <img class="right" src="../assets/statusbar-signal.svg" alt="" width="78.4" height="13">
  </div>

  <div class="content">
    <div class="title-row">
      <div class="title">情報を入力</div>
    </div>

    <div class="sections">
      <div class="section-group">
        <div class="section">
          <div class="section-label">ログ情報</div>
          <div class="card">
            <div class="card-row" data-tap="focus:title-field">
              <span class="placeholder editable-title" contenteditable="true" data-placeholder="タイトルを入力"></span>
            </div>
            <div class="card-row memo" data-tap="focus:memo-field">
              <span class="placeholder editable-title" contenteditable="true" data-placeholder="メモ"></span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">保存先</div>
          <div class="card">
            <div class="card-row" data-tap="open:group-picker">
              <div class="row-left">
                <img src="../assets/icon-group.svg" alt="">
                <span>グループ</span>
              </div>
              <div class="row-right">
                <span class="value js-group-value">UIUXデザイン</span>
                <img src="../assets/chevron-right-disclosure.svg" alt="">
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">ほか</div>
          <div class="card">
            <div class="card-row" data-tap="open:tag-picker">
              <div class="row-left">
                <img src="../assets/icon-tag-bookmark.svg" alt="">
                <span>タグ</span>
              </div>
              <div class="row-right">
                <span class="chip tag-chip">オンライン相談会</span>
                <span class="chip tag-chip">+1</span>
                <img src="../assets/chevron-right-disclosure.svg" alt="">
              </div>
            </div>
            <div class="card-row" data-tap="open:status-picker">
              <div class="row-left">
                <img src="../assets/icon-status-ring.svg" alt="">
                <span>ステータス</span>
              </div>
              <div class="row-right">
                <span class="value js-status-value">商談中</span>
                <img src="../assets/chevron-right-disclosure.svg" alt="">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <div class="btn btn-primary save-btn" data-tap="save:metadata">保存</div>
        <div class="cancel-btn" data-tap="back">キャンセル</div>
      </div>
    </div>
  </div>

  <!-- home indicator -->
  <div class="home-indicator"><i></i></div>
</section>
