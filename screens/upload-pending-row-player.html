<section class="board" id="scr-upload-pending-row-player">
  <style>
    #scr-upload-pending-row-player { background: #f8f9fa; }
    #scr-upload-pending-row-player .pw-content { position: absolute; left: 16px; top: 53.5px; width: 398px; }
    #scr-upload-pending-row-player .pw-header { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
    #scr-upload-pending-row-player .pw-header .back-btn { width: 32px; height: 32px; cursor: pointer; display: block; }
    #scr-upload-pending-row-player .pw-header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; }
    #scr-upload-pending-row-player .pw-header-action { font-size: 18px; font-weight: 300; color: var(--text); cursor: pointer; }

    #scr-upload-pending-row-player .rec-list { display: flex; flex-direction: column; gap: 12px; }
    #scr-upload-pending-row-player .rec-card { background: #fff; border-radius: 12px; padding: 20px 16px; cursor: pointer; }
    #scr-upload-pending-row-player .rec-card--expanded { padding-bottom: 12px; }
    #scr-upload-pending-row-player .rec-card--expanded .rec-meta { margin-bottom: 16px; }
    #scr-upload-pending-row-player .rec-title {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; margin: 0 0 16px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #scr-upload-pending-row-player .rec-meta { display: flex; align-items: center; gap: 8px; height: 20px; }
    #scr-upload-pending-row-player .rec-meta-left { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-faint); font-weight: 300; min-width: 0; flex: 1; }
    #scr-upload-pending-row-player .rec-meta-left .grp,
    #scr-upload-pending-row-player .rec-meta-left .dur { display: flex; align-items: center; gap: 2px; }
    #scr-upload-pending-row-player .rec-meta-left .dur { gap: 4px; }
    #scr-upload-pending-row-player .rec-meta-left .grp { min-width: 0; flex: 0 1 auto; }
    #scr-upload-pending-row-player .rec-meta-left .grp-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #scr-upload-pending-row-player .rec-meta-left .sep,
    #scr-upload-pending-row-player .rec-meta-left .dur,
    #scr-upload-pending-row-player .rec-meta-left > span:not(.grp) { flex-shrink: 0; }
    #scr-upload-pending-row-player .rec-meta-left .sep { width: 1px; height: 12px; background: var(--border); }
    #scr-upload-pending-row-player .rec-meta-left img { display: block; flex-shrink: 0; }
    #scr-upload-pending-row-player .rec-menu-btn { width: 20px; height: 20px; cursor: pointer; display: block; flex-shrink: 0; }

    #scr-upload-pending-row-player .player { margin-top: 20px; display: flex; flex-direction: column; gap: 20px; }
    #scr-upload-pending-row-player .player-track { position: relative; height: 8px; border-radius: 24px; background: #e0e1e2; }
    #scr-upload-pending-row-player .player-fill { position: absolute; left: 0; top: 0; height: 8px; width: 52px; border-radius: 24px; background: var(--text); }
    #scr-upload-pending-row-player .player-times { display: flex; justify-content: space-between; font-family: "Hiragino Sans", sans-serif; font-weight: 300; font-size: 12px; color: #929294; margin-top: 8px; }
    #scr-upload-pending-row-player .player-controls { display: flex; align-items: center; justify-content: space-between; }
    #scr-upload-pending-row-player .player-center { display: flex; align-items: center; gap: 19.5px; }
    #scr-upload-pending-row-player .player-controls img { cursor: pointer; display: block; }
  </style>

  <!-- status bar -->

    <span class="time">9:41</span>

  </div>

  <div class="pw-content">

      <p class="pw-header-action" data-tap="toggle:select-mode">選択</p>

    <div class="rec-list">

            <span class="sep"></span>
            <span>2026/02/10</span>
            <span class="sep"></span>
            <span class="dur"><img src="../assets/audio-duration-icon.svg" width="12" height="12" alt="">29:15</span>
          </div>
          <img class="rec-menu-btn" data-tap="open:row-menu:rec-1" src="../assets/row-menu-dots.svg" width="20" height="20" alt="メニュー">
        </div>
        <div class="player-slot"></div>

            <span class="sep"></span>
            <span>2026/02/10</span>
            <span class="sep"></span>
            <span class="dur"><img src="../assets/audio-duration-icon.svg" width="12" height="12" alt="">29:15</span>
          </div>
          <img class="rec-menu-btn" data-tap="open:row-menu:rec-2" src="../assets/row-menu-dots.svg" width="20" height="20" alt="メニュー">
        </div>
        <div class="player-slot"></div>
      </div>

      <div class="rec-card" data-tap="toggle:row-player:rec-3">
        <p class="rec-title">話者統合機能のUI改善とQAチーム連携</p>
        <div class="rec-meta">
          <div class="rec-meta-left">
            <span class="grp"><img src="../assets/icon-workspace-building.svg" width="16" height="16" alt=""><span class="grp-label">UIUXデザイン</span></span>
            <span class="sep"></span>
            <span>2026/02/10</span>
            <span class="sep"></span>
            <span class="dur"><img src="../assets/audio-duration-icon.svg" width="12" height="12" alt="">29:15</span>
          </div>
          <img class="rec-menu-btn" data-tap="open:row-menu:rec-3" src="../assets/row-menu-dots.svg" width="20" height="20" alt="メニュー">
        </div>
        <div class="player-slot"></div>
      </div>

      <div class="rec-card" data-tap="toggle:row-player:rec-4">
        <p class="rec-title">話者統合機能のUI改善とQAチーム連携</p>
        <div class="rec-meta">
          <div class="rec-meta-left">
            <span class="grp"><img src="../assets/icon-workspace-building.svg" width="16" height="16" alt=""><span class="grp-label">UIUXデザイン</span></span>
            <span class="sep"></span>
            <span>2026/02/10</span>
            <span class="sep"></span>
            <span class="dur"><img src="../assets/audio-duration-icon.svg" width="12" height="12" alt="">29:15</span>
          </div>
          <img class="rec-menu-btn" data-tap="open:row-menu:rec-4" src="../assets/row-menu-dots.svg" width="20" height="20" alt="メニュー">
        </div>
        <div class="player-slot"></div>
      </div>
    </div>
  </div>

  <!-- reusable inline player — JS moves this into whichever card's
       .player-slot is currently expanded; data-tap values are generic
       ("current") since only one row is ever expanded at a time. -->
  <template id="rowPlayerTemplate">
    <div class="player">
      <div>
        <div class="player-track"><div class="player-fill"></div></div>
        <div class="player-times"><span>04:29</span><span>31:08</span></div>
      </div>
      <div class="player-controls">
        <img data-tap="delete:current" src="../assets/trash-icon-red.svg" width="24" height="24" alt="削除">
        <div class="player-center">
          <img data-tap="seek:back15:current" src="../assets/skip-back-15.svg" width="26" height="26" alt="15秒戻る">
          <img data-tap="toggle:play:current" src="../assets/play-button-circle.svg" width="40" height="40" alt="再生">
          <img data-tap="seek:fwd15:current" src="../assets/skip-forward-15.svg" width="26" height="26" alt="15秒進む">
        </div>
        <img data-tap="go:upload-single:current" src="../assets/upload-cloud-green.svg" width="24" height="24" alt="アップロード">
      </div>
    </div>
  </template>

  <!-- home indicator -->
  <div class="home-indicator"><i></i></div>
</section>
